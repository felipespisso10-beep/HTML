<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p {
           display: none;
        }

        div:hover > p {
            display: block;
            color: aliceblue;
            background-color: brown;
        }

        div:hover {
            color: brown;
        }
    </style>
</head>
<body>
    <h1>exemplo de houver</h1>
    <p>passe o mause por cima</p>
    <div>
        passe o mause aqui
        <p>texro escondido..</p>

    </div>
</body>
</html>
